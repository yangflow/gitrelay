# Triggered when a vX.Y.Z tag is pushed.
# Builds an unsigned DMG and attaches it to a GitHub Release.
#
# For a notarized release, run scripts/release.sh locally with the
# DEVELOPER_ID_APPLICATION / APPLE_ID / APPLE_TEAM_ID / APPLE_APP_PASSWORD
# env vars set, then upload the resulting DMG with:
#   gh release create vX.Y.Z dist/GitRelay-X.Y.Z.dmg
name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & publish release
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release DMG
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          chmod +x scripts/release.sh
          ./scripts/release.sh "$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "GitRelay $VERSION" \
            --generate-notes \
            "dist/GitRelay-${VERSION}.dmg#GitRelay ${VERSION} (DMG)" \
            "dist/GitRelay-${VERSION}.dmg.sha256#SHA256"
