# Triggered when a vX.Y.Z tag is pushed without a corresponding release.
# Builds an ad-hoc-signed DMG and publishes a fallback GitHub Release.
#
# For a Sparkle-signed or notarized release, run scripts/release.sh locally with the
# DEVELOPER_ID_APPLICATION / APPLE_ID / APPLE_TEAM_ID / APPLE_APP_PASSWORD
# env vars set, sign the update, and publish the release before the tag event.
# This workflow then detects the existing release and exits without replacing it.
name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & publish release
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Detect an already published release
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "GitRelay $GITHUB_REF_NAME was published before this tag event; skipping the fallback build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Select latest Xcode
        if: steps.published.outputs.exists != 'true'
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show versions
        if: steps.published.outputs.exists != 'true'
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Extract version from tag
        if: steps.published.outputs.exists != 'true'
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release DMG
        if: steps.published.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          chmod +x scripts/release.sh
          ./scripts/release.sh "$VERSION"

      - name: Create GitHub Release
        if: steps.published.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "GitRelay $VERSION" \
            --notes-file CHANGELOG.md \
            "dist/GitRelay-${VERSION}.dmg#GitRelay ${VERSION} (DMG)" \
            "dist/GitRelay-${VERSION}.dmg.sha256#SHA256"
