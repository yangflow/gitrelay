name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Check for unlocalized Chinese strings
        run: python3 scripts/check_unlocalized_strings.py

      - name: Validate string catalog
        run: python3 scripts/check_string_catalog.py

      - name: Build & run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project gitrelay.xcodeproj \
            -scheme gitrelay \
            -destination 'platform=macOS' \
            -testLanguage en \
            -testRegion US \
            -only-testing:gitrelayTests \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
